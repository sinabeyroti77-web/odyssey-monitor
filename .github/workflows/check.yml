name: Cineplex Odyssey Date Check

on:
  schedule:
    # ============================================================
    # All cron times are UTC. Vancouver in summer = PDT = UTC-7.
    #
    # NOTE: GitHub often delays or DROPS scheduled runs under load,
    # so treat these as "best effort" targets, not guarantees.
    # ============================================================

    # ---- EVENING WINDOW: 9:00 PM -> 2:00 AM PT, every 30 minutes ----
    # 9pm-2am PT  ==  04:00 -> 08:59 UTC (next day)
    - cron: "*/30 4-8 * * *"

    # ---- DAYTIME WINDOW: 8:00 AM -> 9:00 PM PT, every 2 hours ----
    # 8am,10am,12pm,2pm,4pm,6pm,8pm PT == UTC 15,17,19,21,23,01,03
    - cron: "0 15,17,19,21,23 * * *"   # 8am,10am,12pm,2pm,4pm PT
    - cron: "0 1,3 * * *"              # 6pm, 8pm PT

  # External trigger (e.g. cron-job.org) -- reliable alternative to
  # GitHub's own flaky scheduler. Both windows can be hit this way.
  repository_dispatch:
    types: [run-check]

  workflow_dispatch: {}

concurrency:
  group: odyssey-date-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cineplex_monitor.py

      - name: Commit updated state file (if changed)
        run: |
          git config user.name "cineplex-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f last_dates.txt ]; then
            git add last_dates.txt
            git diff --quiet --cached || git commit -m "Update last known dates"
            git pull --rebase --autostash || true
            git push
          else
            echo "last_dates.txt was not created this run -- skipping commit."
          fi
