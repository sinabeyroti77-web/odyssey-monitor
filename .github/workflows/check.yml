name: Cineplex Odyssey Date Check

on:
  schedule:
    # Runs every 15 minutes. GitHub's actual timing can lag a few
    # minutes during busy periods -- that's normal, not a bug.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed so the workflow can commit the updated state file back
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cineplex_monitor.py

      - name: Commit updated state file (if changed)
        run: |
          git config user.name "cineplex-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add last_dates.txt
          git diff --quiet --cached || git commit -m "Update last known dates"
          git push
